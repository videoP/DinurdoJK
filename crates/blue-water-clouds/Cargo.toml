[package]
name = "blue-water-clouds"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license = "MIT"

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam.workspace = true
naga_oil = { version = "0.23.0", default-features = false }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "naga-ir", "dx12", "vulkan"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
naval-render = { package = "blue-water-render", path = "../blue-water-render" }
naval-sim = { package = "blue-water-sim", path = "../blue-water-sim" }
naval-sky = { package = "blue-water-sky", path = "../blue-water-sky" }

[dev-dependencies]
futures-lite = "=2.6.1"
