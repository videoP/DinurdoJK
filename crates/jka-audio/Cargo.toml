[package]
name = "jka-audio"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
jka-assets = { path = "../jka-assets" }
jka-emotes = { path = "../jka-emotes" }
serde_json = "=1.0.151"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
audionimbus = { version = "=0.16.0", features = ["auto-install"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader"] }

[build-dependencies]
cc = "=1.4.6"
