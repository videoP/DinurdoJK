[package]
name = "jka-ninja"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Fluid Ninja Live 2 port: public facade. The implementation is private (DinurdoJK-ninja repository); without it this crate builds a stub."

# The private implementation shares these dependencies. Keep them here even
# though the stub does not use them, so Cargo.lock is identical with and
# without the private checkout (`cargo build --locked` in CI).
[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "spirv", "dx12", "vulkan", "metal"] }
