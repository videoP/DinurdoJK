[package]
name = "DinurdoJK"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "DinurdoJK"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
futures-lite = "=2.6.1"
fastnoise-lite = "=1.1.1"
egui = "=0.34.3"
egui-wgpu = { version = "=0.34.3", default-features = false }
egui-winit = "=0.34.3"
glam = "=0.32.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tga", "hdr"] }
image_dds = { version = "=0.7.2", default-features = false, features = ["ddsfile"] }
libjpeg-turbo-rs = "=0.8.0"
jka-assets = { path = "../jka-assets" }
jka-movement = { path = "../jka-movement" }
jka-protocol = { path = "../jka-protocol" }
log = "=0.4.34"
oximedia-lut = "=0.2.1"
smaa = { path = "../../vendor/smaa-0.20.0" }
serde_json = "=1.0.151"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav", "mp3"] }
audionimbus = { version = "=0.16.0", features = ["auto-install"] }
rayon = "=1.11.0"
rapier3d = "=0.35.3"
rapier-cloth-core = { path = "../jka-cloth-core" }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }
winit = "=0.30.13"

[dev-dependencies]
# Offline WGSL parsing/validation for the shader tests. Pinned to the same
# version wgpu 29 uses so the tests accept exactly what the runtime will.
naga = { version = "=29.0.4", features = ["wgsl-in"] }

[build-dependencies]
png = "=0.18.1"
