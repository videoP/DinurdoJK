[package]
name = "DinurdoJK"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "DinurdoJK"
path = "src/main.rs"

[dependencies]
blue-water-core = { path = "../blue-water-core" }
blue-water-gpu = { path = "../blue-water-gpu" }
blue-water-render = { path = "../blue-water-render" }
blue-water-fx = { path = "../blue-water-fx" }
blue-water-clouds = { path = "../blue-water-clouds" }
blue-water-sky = { path = "../blue-water-sky" }
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
futures-lite = "=2.6.1"
fastnoise-lite = "=1.1.1"
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
egui-winit = "=0.36.2"
glam = "=0.32.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tga", "hdr"] }
image_dds = { version = "=0.7.2", default-features = false, features = ["ddsfile"] }
libjpeg-turbo-rs = "=0.8.0"
jka-assets = { path = "../jka-assets" }
jka-emotes = { path = "../jka-emotes" }
jka-ue-assets = { path = "../jka-ue-assets" }
jka-ue-runtime = { path = "../jka-ue-runtime" }
jka-movement = { path = "../jka-movement" }
jka-protocol = { path = "../jka-protocol" }
log = "=0.4.34"
meshopt = "=0.6.2"
oximedia-lut = "=0.2.1"
smaa = { path = "../../vendor/smaa-0.21.0" }
serde_json = "=1.0.151"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
audionimbus = { version = "=0.16.0", features = ["auto-install"] }
rayon = "=1.11.0"
rhai = "=1.26.1"
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.9.8"
rapier3d = "=0.35.3"
rapier-cloth-core = { path = "../jka-cloth-core" }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }
winit = "=0.30.13"

[dev-dependencies]
jka-water = { path = "../jka-water" }
# Offline WGSL parsing/validation for the shader tests. Pinned to the same
# version wgpu 30 uses so the tests accept exactly what the runtime will.
naga = { version = "=30.0.0", features = ["wgsl-in"] }

[build-dependencies]
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_ColorSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_WindowsProgramming", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Security"] }
