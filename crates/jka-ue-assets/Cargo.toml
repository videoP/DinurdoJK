[package]
name = "jka-ue-assets"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "djk-ue-import"
path = "src/main.rs"

[dependencies]
jka-assets = { path = "../jka-assets" }
glam.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
