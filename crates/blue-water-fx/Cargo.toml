[package]
name = "blue-water-fx"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license = "MIT"

[dependencies]
blue-water-core = { path = "../blue-water-core" }
blue-water-gpu = { path = "../blue-water-gpu" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = "=0.33.9"
naga_oil = { version = "0.23.0", default-features = false }
naval-render = { package = "blue-water-render", path = "../blue-water-render" }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "naga-ir", "dx12", "vulkan"] }

[dev-dependencies]
futures-lite = "=2.6.1"
