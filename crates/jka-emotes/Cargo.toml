[package]
name = "jka-emotes"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "djk-fnemote"
path = "src/main.rs"

[dependencies]
jka-assets = { path = "../jka-assets" }
jka-ue-assets = { path = "../jka-ue-assets" }
serde_json = "=1.0.151"
glam = "=0.32.1"
flacenc = { version = "=0.5.1", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate", "zstd"] }
vorbis_rs = { version = "=0.5.5", default-features = false }
half = "=2.7.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
