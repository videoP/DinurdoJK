[package]
name = "blue-water-gpu"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
blue-water-core = { path = "../blue-water-core" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = "=0.32.1"
half = "=2.7.1"
naga_oil = { version = "0.23.0", default-features = false }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "naga-ir", "dx12", "vulkan"] }
[dev-dependencies]
futures-lite = "=2.6.1"
