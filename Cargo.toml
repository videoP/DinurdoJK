[workspace]
members = ["crates/blue-water-core", "crates/blue-water-gpu", "crates/blue-water-render", "crates/blue-water-sim", "crates/blue-water-sky",
    "crates/blue-water-clouds", "crates/blue-water-fx", "crates/jka-protocol", "crates/jka-probe", "crates/jka-assets", "crates/jka-client", "crates/jka-cloth-core", "crates/jka-movement", "crates/jka-water", "crates/jka-ue-assets", "crates/jka-ue-runtime", "crates/jka-emotes"]
resolver = "2"

[workspace.dependencies]
glam = "=0.33.9"

[workspace.package]
edition = "2021"
publish = false

[profile.release]
# Ship builds carry no symbol table; source paths are scrubbed via --remap-path-prefix
# in build.ps1. The .pdb stays beside the exe for local debugging but is not shipped.
strip = true
lto = true
codegen-units = 1

# -Fast: optimized iteration (original ThinLTO settings, persistent incremental cache).
# -Faster: visual-only iteration, fast codegen and minimal cache churn.
# Each profile has its own target/<profile> folder; no automatic cache cleanup.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

[profile.faster]
inherits = "release"
opt-level = 0
# Keep line tables for crash dumps. The executable stays unoptimized; this only
# emits the external PDB used to resolve native stack traces.
debug = 1
lto = "off"
codegen-units = 16
incremental = false

# wgpu-core 30.0.1 with one fix: Queue::present re-transitions the surface
# PRESENT -> PRESENT and pays a second queue submit every frame (~20 us, ~5-8% at
# 2500 fps). See vendor/README.md. Drop this once upstream fixes it.
[patch.crates-io]
wgpu-core = { path = "vendor/wgpu-core-30.0.1" }
wgpu-hal = { path = "vendor/wgpu-hal-30.0.1" }
wgpu-types = { path = "vendor/wgpu-types-30.0.1" }
winit = { path = "vendor/winit-0.30.13" }
dlss_wgpu = { path = "vendor/dlss_wgpu-6.0.0" }
