[workspace]
members = ["crates/blue-water-core", "crates/blue-water-gpu", "crates/blue-water-render", "crates/blue-water-sim", "crates/blue-water-sky",
    "crates/blue-water-clouds", "crates/blue-water-fx", "crates/jka-protocol", "crates/jka-probe", "crates/jka-assets", "crates/jka-client", "crates/jka-cloth-core", "crates/jka-movement", "crates/jka-water"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[profile.release]
# Ship builds carry no symbol table; source paths are scrubbed via --remap-path-prefix
# in build.ps1. The .pdb stays beside the exe for local debugging but is not shipped.
strip = true
lto = true
codegen-units = 1

# Iteration profile (build.ps1 -Fast). The custom profile builds into its
# own target/<name> folder, so switching modes never discards another mode's cache.
# Measured 2026-10-11 on AMJH3TE (one-line change rebuild / FPS vs release):
#   fast   ~60 s rebuild, about -2% FPS: fine for day-to-day FPS checks.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

# wgpu-core 30.0.1 with one fix: Queue::present re-transitions the surface
# PRESENT -> PRESENT and pays a second queue submit every frame (~20 us, ~5-8% at
# 2500 fps). See vendor/README.md. Drop this once upstream fixes it.
[patch.crates-io]
wgpu-core = { path = "vendor/wgpu-core-30.0.1" }
wgpu-hal = { path = "vendor/wgpu-hal-30.0.1" }
winit = { path = "vendor/winit-0.30.13" }
