name: DinurdoJK Signed Multi-Platform Release

# All platform jobs are eligible for the SAME protected environment review at
# the same time, allowing a single Review deployments approval for this run.
# Build/signing runs remain independent; publish consumes only successful output.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dinurdojk-signed-multiplatform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86-64 (build + sign)
    if: github.repository == 'videoP/DinurdoJK' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 180
    environment: release-signing
    outputs:
      # Public, not secret: lets the publisher re-verify every signature.
      public_key: ${{ vars.DINURDOJK_UPDATE_PUBLIC_KEY_HEX }}
    permissions:
      contents: read
    env:
      # The public key must be present at RUST COMPILATION time.
      DINURDOJK_UPDATE_PUBLIC_KEY_HEX: ${{ vars.DINURDOJK_UPDATE_PUBLIC_KEY_HEX }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit count is the patch number: a shallow clone would break it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MAJOR.MINOR come from Cargo.toml; the patch number is the number of
      # commits, so every push is a newer version. Applied to this runner's
      # checkout only (never committed), before anything reads the version.
      - name: Stamp build number into the version
        shell: pwsh
        run: |
          python scripts/stamp_ci_version.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not stamp the build version.' }

      - name: Validate version, keys and release eligibility
        id: version
        shell: pwsh
        run: |
          if ($env:DINURDOJK_UPDATE_PUBLIC_KEY_HEX -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'Missing release-signing Environment variable DINURDOJK_UPDATE_PUBLIC_KEY_HEX.'
          }
          $tag = (& python scripts/make_signed_release.py --print-tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Invalid Cargo package version (expected vMAJOR.MINOR.PATCH).'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $json = gh release list --limit 100 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect GitHub Releases.' }
          $releases = @($json | ConvertFrom-Json)
          $existingRelease = @($releases | Where-Object { $_.tagName -eq $tag })
          if ($existingRelease.Count -gt 0) {
            $info = gh release view $tag --json targetCommitish,assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $info.targetCommitish -ne $env:GITHUB_SHA) {
              throw "Existing release $tag points to another commit; refusing to modify."
            }
            if (@($info.assets | Where-Object { $_.name -eq 'release-manifest.sig' }).Count -gt 0) {
              Write-Host "$tag already includes signed Windows assets; skipping Windows compilation."
              'publish=false' >> $env:GITHUB_OUTPUT
              exit 0
            }
            'publish=true' >> $env:GITHUB_OUTPUT
            Write-Host "Completing missing Windows platform assets for $tag."
            exit 0
          }
          $version = [Version]::Parse($tag.Substring(1))
          foreach ($r in $releases) {
            if (-not $r.isDraft -and -not $r.isPrerelease -and $r.tagName -match '^v\d+\.\d+\.\d+$') {
              if ($version -le [Version]::Parse($r.tagName.Substring(1))) {
                throw "$tag is not newer than published release $($r.tagName). Bump crates/jka-client/Cargo.toml."
              }
            }
          }
          $existingTag = git ls-remote --tags --refs origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check tags.' }
          if ($existingTag) { throw "Tag $tag already exists without a Release; refusing to retag it." }
          'publish=true' >> $env:GITHUB_OUTPUT
          Write-Host "Building $tag from $env:GITHUB_SHA."

      # The full NWH module is deliberately absent from Git. Restore it only
      # for an approved release, before Cargo runs build.rs / rustc.
      - name: Restore local-only NWH source
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          DINURDOJK_NWH_SOURCE_B64: ${{ secrets.DINURDOJK_NWH_SOURCE_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DINURDOJK_NWH_SOURCE_B64)) {
            throw 'Missing release-signing Environment secret DINURDOJK_NWH_SOURCE_B64.'
          }
          $relativePath = 'crates/jka-client/src/net/nwh_private.rs'
          if (Test-Path -LiteralPath $relativePath) {
            throw 'Private NWH source unexpectedly exists in repository checkout.'
          }
          $fileBytes = [Convert]::FromBase64String($env:DINURDOJK_NWH_SOURCE_B64.Trim())
          if ($fileBytes.Length -eq 0) { throw 'Empty private NWH source.' }
          New-Item -ItemType Directory -Force (Split-Path $relativePath -Parent) | Out-Null
          $absolutePath = Join-Path (Get-Location).Path $relativePath
          [System.IO.File]::WriteAllBytes($absolutePath, $fileBytes)
          # No source content or key material is printed to Actions logs.
          Write-Host 'Restored private NWH module for release compilation.'

      - name: Install Rust
        if: steps.version.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust compilation
        if: steps.version.outputs.publish == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install Vulkan SDK
        if: steps.version.outputs.publish == 'true'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Check Vulkan SDK
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) {
            throw 'VULKAN_SDK not configured by SDK installer.'
          }

      - name: Ensure libclang
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            choco install llvm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed.' }
          }
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) { throw 'libclang.dll missing.' }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV

      - name: Fetch NVIDIA DLSS SDK v310.9.1
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'NVIDIA-DLSS-310.9.1'
          git clone --depth 1 --branch v310.9.1 https://github.com/NVIDIA/DLSS.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'DLSS SDK download failed.' }
          Push-Location $sdk
          try {
            git lfs pull
            if ($LASTEXITCODE -ne 0) { throw 'DLSS SDK LFS download failed.' }
          } finally { Pop-Location }
          $dll = Join-Path $sdk 'lib\Windows_x86_64\rel\nvngx_dlss.dll'
          if (-not (Test-Path $dll) -or (Get-Item $dll).Length -lt 1000000) {
            throw 'nvngx_dlss.dll missing or appears to be an LFS pointer.'
          }
          $stream = [System.IO.File]::OpenRead($dll)
          try { $mz = ($stream.ReadByte() -eq 77 -and $stream.ReadByte() -eq 90) }
          finally { $stream.Dispose() }
          if (-not $mz) { throw 'DLSS DLL is not a Windows PE file.' }
          if (-not (Test-Path (Join-Path $sdk 'LICENSE.txt'))) { throw 'NVIDIA SDK license missing.' }
          "DLSS_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Prepare required build helpers and license
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          foreach ($helper in @('scripts/build-cache-report.ps1', 'scripts/ensure-smaa-vendor.ps1', 'scripts/ensure-openal-runtime.ps1')) {
            if (-not (Test-Path $helper)) { throw "Missing $helper. Commit your local build helpers first." }
          }
          if (-not (Test-Path 'assets/dinurdo-assets.pk4')) {
            throw 'Missing committed assets/dinurdo-assets.pk4 for the signed ZIP.'
          }
          # All notices are tracked files. Fail NOW, before 30 minutes of Cargo.
          foreach ($name in @('FFmpeg-GPL-3.0.txt', 'FFmpeg-SOURCE-NOTICE.txt',
                               'OpenAL-Soft-LGPL-2.0.txt', 'DXC-LICENSE.txt',
                               'DXC-ThirdPartyNotices.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release-licenses' $name) -PathType Leaf)) {
              throw "Missing committed release-licenses/$name. Run release-licenses/Fetch-Official-Notices.cmd locally, then commit the files."
            }
          }
          # Current build.ps1 expects a target/fast license even in Release mode.
          $license = 'target/fast/licenses/OpenAL-Soft-LGPL-2.0.txt'
          New-Item -ItemType Directory -Force (Split-Path $license) | Out-Null
          Copy-Item -LiteralPath 'release-licenses/OpenAL-Soft-LGPL-2.0.txt' -Destination $license -ErrorAction Stop
          if (-not (Test-Path $license) -or (Get-Item $license).Length -eq 0) {
            throw 'Committed OpenAL Soft license is missing or empty.'
          }
          # Stage OpenAL from the same pinned/runtime helper used by build.ps1.
          # Do this BEFORE the expensive Rust build so missing DLLs fail early.
          $workspace = (Get-Location).Path
          . (Join-Path $workspace 'scripts/ensure-openal-runtime.ps1')
          $openal = Ensure-OpenALRuntime -WorkspaceRoot $workspace
          if (-not $openal -or -not (Test-Path -LiteralPath $openal -PathType Leaf)) {
            throw 'Ensure-OpenALRuntime did not return an existing OpenAL DLL.'
          }
          $openal = (Resolve-Path -LiteralPath $openal).Path
          $dllStream = [IO.File]::OpenRead($openal)
          try { $isPE = ($dllStream.ReadByte() -eq 0x4d -and $dllStream.ReadByte() -eq 0x5a) }
          finally { $dllStream.Dispose() }
          if (-not $isPE -or (Get-Item -LiteralPath $openal).Length -lt 32768) {
            throw "OpenAL runtime is not a valid-looking Windows DLL: $openal"
          }
          $dependencyDir = 'target/release/DinurdoJK/dependencies'
          New-Item -ItemType Directory -Force $dependencyDir | Out-Null
          $openalStaged = Join-Path $dependencyDir 'OpenALSoft.x86_64.dll'
          if ([IO.Path]::GetFullPath($openal) -ine [IO.Path]::GetFullPath($openalStaged)) {
            Copy-Item -LiteralPath $openal -Destination $openalStaged -Force -ErrorAction Stop
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $openal).Hash -ne
              (Get-FileHash -Algorithm SHA256 -LiteralPath $openalStaged).Hash) {
            throw 'Staged OpenAL DLL hash differs from helper output.'
          }
          Write-Host "Pre-staged OpenALSoft.x86_64.dll in $dependencyDir"

      # Render Studio resolves ffmpeg.exe only from DinurdoJK/dependencies/.
      # Gyan's Windows x64 essentials build is static and includes the codecs
      # used by the exporter (libx264, prores_ks, and NVENC support).
      # Pin the immutable versioned archive and its published SHA-256.
      - name: Stage pinned FFmpeg 9.0.2 x64 runtime
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip'
          $expectedSha256 = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-essentials_build.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-essentials_build'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Download attempt $attempt failed; retrying..."
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -cne $expectedSha256) {
            throw "FFmpeg archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          $candidates = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter 'ffmpeg.exe' |
            Where-Object { (Split-Path -Path $_.DirectoryName -Leaf) -ieq 'bin' })
          if ($candidates.Count -ne 1) {
            throw "Expected one x64 FFmpeg bin/ffmpeg.exe in the pinned archive; found $($candidates.Count)."
          }
          $ffmpeg = $candidates[0].FullName
          $stream = [IO.File]::OpenRead($ffmpeg)
          try { $isPe = ($stream.ReadByte() -eq 0x4d -and $stream.ReadByte() -eq 0x5a) }
          finally { $stream.Dispose() }
          if (-not $isPe -or (Get-Item -LiteralPath $ffmpeg).Length -lt 5000000) {
            throw "FFmpeg is missing, truncated or not a Windows executable: $ffmpeg"
          }
          $versionInfo = (& $ffmpeg -hide_banner -version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $versionInfo -notmatch 'ffmpeg version 9\.0\.2' -or
              $versionInfo -notmatch '--enable-gpl') {
            throw 'Pinned FFmpeg build is not the expected GPL-enabled 9.0.2 release.'
          }
          $encoders = (& $ffmpeg -hide_banner -encoders 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg could not enumerate encoders.' }
          foreach ($encoder in @('libx264', 'prores_ks', 'h264_nvenc')) {
            if ($encoders -notmatch "\b$encoder\b") {
              throw "Pinned FFmpeg lacks required Render Studio encoder: $encoder"
            }
          }
          $deps = 'target/release/DinurdoJK/dependencies'
          New-Item -ItemType Directory -Force $deps | Out-Null
          $destination = Join-Path $deps 'ffmpeg.exe'
          Copy-Item -LiteralPath $ffmpeg -Destination $destination -Force -ErrorAction Stop
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash -ne
              (Get-FileHash -Algorithm SHA256 -LiteralPath $ffmpeg).Hash) {
            throw 'Staged FFmpeg executable does not match the verified archive.'
          }
          Write-Host "Staged pinned ffmpeg.exe ($('{0:N1}' -f ((Get-Item $destination).Length / 1MB)) MiB) in $deps"

          # FFmpeg notices are committed in release-licenses/ and placed in
          # the full ZIP by the packager, not downloaded by the auto-updater.


      # Restore the *archive*, not unpacked DLLs. Re-check its pinned SHA-256
      # before use; saving here (rather than at job exit) protects against later
      # compilation or publishing failures wasting an already verified download.
      - name: Restore pinned Microsoft DXC archive cache
        id: dxc_cache
        if: steps.version.outputs.publish == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dxc_2026_09_29.zip
          key: dxc-windows-x64-v1.9.2609-ad31b1fc8443175d

      # Pin the exact official Microsoft Windows DXC archive and verify its
      # SHA-256 before any binaries are included in an authenticated release.
      # Source: microsoft/DirectXShaderCompiler v1.9.2609 (2026-09-29).
      - name: Stage pinned Microsoft DXC x64 runtime
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = 'v1.9.2609'
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$version/dxc_2026_09_29.zip"
          $expectedSha256 = 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1'
          $archive = Join-Path $env:RUNNER_TEMP 'dxc_2026_09_29.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'dxc_2026_09_29'
          if (Test-Path -LiteralPath $archive -PathType Leaf) {
            $cachedSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($cachedSha256 -cne $expectedSha256) {
              throw "Cached Microsoft DXC archive checksum mismatch: $cachedSha256. Refusing unverified cache."
            }
            Write-Host 'Using checksum-verified cached DXC archive.'
          } else {
            $downloaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $archive -ErrorAction Stop
                $downloaded = $true
                break
              } catch {
                Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
                Write-Warning "DXC direct download attempt $attempt failed: $($_.Exception.Message)"
                if ($attempt -lt 3) { Start-Sleep -Seconds (3 * $attempt) }
              }
            }
            if (-not $downloaded) {
              # GitHub CLI uses the release-assets API rather than the browser
              # download URL. Both paths still require the same pinned checksum.
              Write-Warning 'DXC direct URL failed; trying GitHub CLI asset download.'
              gh release download $version --repo microsoft/DirectXShaderCompiler --pattern 'dxc_2026_09_29.zip' --dir $env:RUNNER_TEMP --clobber
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive -PathType Leaf)) {
                throw 'Failed to download pinned Microsoft DXC archive from both endpoints.'
              }
            }
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $expectedSha256) {
              throw "Microsoft DXC download checksum mismatch: $actualSha256"
            }
            Write-Host 'Verified pinned DXC archive SHA-256.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          foreach ($name in @('dxcompiler.dll', 'dxil.dll')) {
            $source = Join-Path $unpacked "bin/x64/$name"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or
                (Get-Item -LiteralPath $source).Length -lt 100000) {
              throw "Pinned DXC archive is missing x64 $name"
            }
            $stream = [IO.File]::OpenRead($source)
            try { $isPe = ($stream.ReadByte() -eq 0x4d -and $stream.ReadByte() -eq 0x5a) }
            finally { $stream.Dispose() }
            if (-not $isPe) { throw "Not a Windows PE file: $name" }
            $deps = 'target/release/DinurdoJK/dependencies'
            New-Item -ItemType Directory -Force $deps | Out-Null
            Copy-Item -LiteralPath $source -Destination (Join-Path $deps $name) -Force
          }
          # Ship Microsoft's license and third-party notices alongside the
          # signed DLLs. Like all other update assets these are hash-verified.
          $licenses = 'target/release/licenses'
          New-Item -ItemType Directory -Force $licenses | Out-Null
          foreach ($name in @('DXC-LICENSE.txt', 'DXC-ThirdPartyNotices.txt')) {
            $sourceNotice = Join-Path 'release-licenses' $name
            $destination = Join-Path $licenses $name
            Copy-Item -LiteralPath $sourceNotice -Destination $destination -ErrorAction Stop
            if ((Get-Item -LiteralPath $destination).Length -lt 1000) {
              throw "Committed Microsoft DXC notice missing or truncated: $name"
            }
          }
          Write-Host 'Staged checksum-verified Microsoft DXC x64 DLLs and notices.'

      # Save the verified archive immediately, not after the Rust build.
      - name: Save verified Microsoft DXC archive cache
        if: steps.version.outputs.publish == 'true' && steps.dxc_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dxc_2026_09_29.zip
          key: ${{ steps.dxc_cache.outputs.cache-primary-key }}

      # Fail fast on signer dependencies before the expensive compilation.
      # The PRIVATE signing key is supplied only to the later signing step.
      - name: Install Ed25519 signer
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'cryptography>=43,<48'
          if ($LASTEXITCODE -ne 0) { throw 'Ed25519 cryptography installation failed.' }
          python -c 'from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; print("Ed25519 signer ready")'
          if ($LASTEXITCODE -ne 0) { throw 'Ed25519 signer import failed.' }

      - name: Build optimized Release with DLAA
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          .\build.ps1 -Fetch -Dlss
          if ($LASTEXITCODE -ne 0) { throw 'DinurdoJK Release build failed.' }
          if (-not (Test-Path 'target/release/DinurdoJK.exe' -PathType Leaf)) {
            throw 'Missing release executable.'
          }
          # The packager understands either staging layout, but always publishes
          # the updated DinurdoJK/dependencies layout in its signed manifest.
          foreach ($dll in @('nvngx_dlss.dll', 'OpenALSoft.x86_64.dll')) {
            if (-not (Test-Path "target/release/DinurdoJK/dependencies/$dll" -PathType Leaf) -and
                -not (Test-Path "target/release/$dll" -PathType Leaf)) {
              throw "Missing required runtime $dll (checked dependencies and legacy staging)."
            }
          }

      - name: Package and sign updater release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          # Private key is exposed to this one signing step, NEVER to the build.
          DINURDOJK_UPDATE_PRIVATE_KEY_B64: ${{ secrets.DINURDOJK_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          $licenseDir = 'target/release/licenses'
          New-Item -ItemType Directory -Force $licenseDir | Out-Null
          foreach ($name in @('OpenAL-Soft-LGPL-2.0.txt', 'DXC-LICENSE.txt',
                              'DXC-ThirdPartyNotices.txt', 'FFmpeg-GPL-3.0.txt',
                              'FFmpeg-SOURCE-NOTICE.txt')) {
            Copy-Item -LiteralPath (Join-Path 'release-licenses' $name) -Destination (Join-Path $licenseDir $name) -ErrorAction Stop
          }
          Copy-Item (Join-Path $env:DLSS_SDK 'LICENSE.txt') (Join-Path $licenseDir 'NVIDIA-DLSS-SDK-LICENSE.txt') -ErrorAction Stop
          foreach ($name in @('dxcompiler.dll', 'dxil.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'target/release/DinurdoJK/dependencies' $name) -PathType Leaf)) {
              throw "Missing Microsoft DXC runtime before signing: $name"
            }
          }
          if (-not (Test-Path -LiteralPath 'target/release/DinurdoJK/dependencies/ffmpeg.exe' -PathType Leaf)) {
            throw 'Missing pinned FFmpeg runtime before signing: DinurdoJK/dependencies/ffmpeg.exe'
          }
          python scripts/make_signed_release.py --runtime target/release --out dist/release --tag '${{ steps.version.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { throw 'Release signing failed.' }
          if ((Get-Item 'dist/release/release-manifest.sig').Length -ne 64) {
            throw 'Signature must be 64 raw Ed25519 bytes.'
          }
          # The full ZIP is for new/manual installations. Individual assets
          # are for the updater; the signed manifest binds their exact hashes.
          $archive = "dist/release/DinurdoJK-${{ steps.version.outputs.tag }}-full.zip"
          python -c 'import sys, json, zipfile, pathlib, hashlib; p=pathlib.Path(sys.argv[1]); d=p.parent; z=zipfile.ZipFile(p); m=json.loads((d/"release-manifest.json").read_bytes()); files=set(m["files"]); names=set(z.namelist()); notices={n for n in names if n.startswith("licenses/")}; required={"licenses/FFmpeg-GPL-3.0.txt","licenses/FFmpeg-SOURCE-NOTICE.txt","licenses/OpenAL-Soft-LGPL-2.0.txt","licenses/DXC-LICENSE.txt","licenses/DXC-ThirdPartyNotices.txt","licenses/NVIDIA-DLSS-SDK-LICENSE.txt"}; assert m["format"]==2; assert names==files|notices; assert required<=notices; assert all(not n.lower().endswith(".txt") for n in files); assert {"DinurdoJK.exe","DinurdoJK/shared/dinurdo-assets.pk4","DinurdoJK/dependencies/dxcompiler.dll","DinurdoJK/dependencies/dxil.dll","DinurdoJK/dependencies/ffmpeg.exe"}<=files; assert all(hashlib.sha256(z.read(n)).hexdigest()==f["sha256"] for n,f in m["files"].items()); print("Verified runtime-only signed manifest and full ZIP license notices")' $archive
          if ($LASTEXITCODE -ne 0) { throw 'Release layout, notices or hashes failed verification.' }

      - name: Upload signed updater artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-windows
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} (build + sign)
    if: >-
      github.repository == 'videoP/DinurdoJK' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment: release-signing
    outputs:
      # Public, not secret: lets the publisher re-verify signatures without
      # joining the protected environment (which would need a second approval).
      public_key: ${{ vars.DINURDOJK_UPDATE_PUBLIC_KEY_HEX }}
    env:
      GH_TOKEN: ${{ github.token }}
      DINURDOJK_UPDATE_PUBLIC_KEY_HEX: ${{ vars.DINURDOJK_UPDATE_PUBLIC_KEY_HEX }}
      CARGO_INCREMENTAL: '0'
      AUDIONIMBUS_AUTO_INSTALL_PROGRESS: '0'
      # libphonon.dylib ships in DinurdoJK/dependencies beside the executable.
      RUSTFLAGS: '-C link-arg=-Wl,-rpath,@executable_path/DinurdoJK/dependencies'

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp version and check release eligibility
        id: release
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 scripts/stamp_ci_version.py
          tag="$(python3 scripts/make_signed_release.py --print-tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [[ "${DINURDOJK_UPDATE_PUBLIC_KEY_HEX:-}" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'Missing release-signing Environment variable DINURDOJK_UPDATE_PUBLIC_KEY_HEX' >&2; exit 1; }
          if info="$(gh release view "$tag" --json targetCommitish,assets 2>/dev/null)"; then
            target="$(jq -r .targetCommitish <<<"$info")"
            [ "$target" = "$GITHUB_SHA" ] || { echo "Release $tag targets $target, not $GITHUB_SHA" >&2; exit 1; }
            if jq -e --arg n "release-manifest-macos-${ARCH}.sig" '.assets[] | select(.name == $n)' <<<"$info" >/dev/null; then
              echo "$tag already has signed macOS ${ARCH} assets; skipping compilation."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Install native Rust and tools
        if: steps.release.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install libclang and CMake
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          brew install llvm cmake pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> "$GITHUB_ENV"
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.rust_target }}'
          test "$(uname -m)" = '${{ matrix.arch }}'

      # Installed BEFORE the private key exists in any step's environment.
      - name: Install Ed25519 signer
        if: steps.release.outputs.build == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check 'cryptography>=44,<48'
          python3 -c 'from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey'

      - name: Cache Rust
        if: steps.release.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-release-${{ matrix.rust_target }}

      - name: Restore private NWH module
        if: steps.release.outputs.build == 'true'
        shell: bash
        env:
          DINURDOJK_NWH_SOURCE_B64: ${{ secrets.DINURDOJK_NWH_SOURCE_B64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          source = os.environ.get('DINURDOJK_NWH_SOURCE_B64', '').strip()
          if not source:
              raise SystemExit('Missing release-signing Environment secret DINURDOJK_NWH_SOURCE_B64')
          path = Path('crates/jka-client/src/net/nwh_private.rs')
          if path.exists():
              raise SystemExit('Private module unexpectedly exists')
          path.write_bytes(base64.b64decode(source, validate=True))
          PY

      - name: Compile native macOS binary
        if: steps.release.outputs.build == 'true'
        run: cargo build --locked --release -p DinurdoJK

      # Steam Audio is linked dynamically (audionimbus auto-install copies
      # libphonon.dylib into its build OUT_DIR). Bundle it beside the binary
      # and make sure the binary resolves it through the @executable_path rpath.
      - name: Stage Steam Audio and verify macOS runtime linkage
        if: steps.release.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/DinurdoJK
          test -x "$binary"
          lipo -archs "$binary" | tr ' ' '\n' | grep -Fx '${{ matrix.arch }}'
          phonon="$(ls -t target/release/build/audionimbus-sys-*/out/lib/libphonon.dylib 2>/dev/null | head -n 1 || true)"
          test -n "$phonon" || { echo 'Steam Audio libphonon.dylib not found in the build output' >&2; exit 1; }
          lipo -archs "$phonon" | tr ' ' '\n' | grep -Fx '${{ matrix.arch }}'
          mkdir -p dist/stage
          cp "$phonon" dist/stage/libphonon.dylib
          chmod 755 dist/stage/libphonon.dylib
          otool -L "$binary" | tee "dist/macos-${{ matrix.arch }}-dependencies.txt"
          # Whatever install name Valve's dylib carries, load it via the rpath.
          linked="$(otool -L "$binary" | awk 'NR>1 && /libphonon\.dylib/ {print $1; exit}')"
          test -n "$linked" || { echo 'Binary does not reference libphonon.dylib' >&2; exit 1; }
          if [ "$linked" != '@rpath/libphonon.dylib' ]; then
            install_name_tool -change "$linked" '@rpath/libphonon.dylib' "$binary"
          fi
          install_name_tool -id '@rpath/libphonon.dylib' dist/stage/libphonon.dylib
          otool -l "$binary" | grep -A2 LC_RPATH | grep -F '@executable_path/DinurdoJK/dependencies'
          if otool -L "$binary" | awk 'NR>1 {print $1}' | grep -Ev '^(/usr/lib/|/System/Library/|@rpath/libphonon\.dylib$)'; then
            echo 'Unexpected non-system dynamic dependency (would be missing on user machines)' >&2
            exit 1
          fi
          echo "PHONON_PATH=$PWD/dist/stage/libphonon.dylib" >> "$GITHUB_ENV"

      # Developer ID credentials are NOT required for standalone macOS releases.
      # Ad-hoc signing satisfies Apple Silicon's code-signature requirement; it
      # is not Developer ID signing or notarization, so Gatekeeper may still
      # quarantine downloads. Signed after install_name_tool edits.
      - name: Ad-hoc code sign
        if: steps.release.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - "$PHONON_PATH"
          codesign --verify --verbose=2 "$PHONON_PATH"
          codesign --force --sign - target/release/DinurdoJK
          codesign --verify --verbose=2 target/release/DinurdoJK

      - name: Package and sign updater manifest
        if: steps.release.outputs.build == 'true'
        shell: bash
        env:
          # Private key is exposed to this one signing step only.
          DINURDOJK_UPDATE_PRIVATE_KEY_B64: ${{ secrets.DINURDOJK_UPDATE_PRIVATE_KEY_B64 }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "${DINURDOJK_UPDATE_PRIVATE_KEY_B64:-}" || {
            echo 'Missing release-signing Environment secret DINURDOJK_UPDATE_PRIVATE_KEY_B64' >&2
            exit 1
          }
          python3 scripts/make_signed_macos_release.py \
            --binary target/release/DinurdoJK \
            --phonon "$PHONON_PATH" \
            --assets assets/dinurdo-assets.pk4 \
            --out "dist/macos-${ARCH}" --tag "$TAG" --arch "$ARCH"
          test "$(wc -c < "dist/macos-${ARCH}/release-manifest-macos-${ARCH}.sig")" -eq 64

      - name: Upload macOS release for common publisher
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-macos-${{ matrix.arch }}
          path: dist/macos-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve macOS diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DinurdoJK-macos-${{ matrix.arch }}-diagnostics-${{ github.run_id }}
          path: dist/macos-${{ matrix.arch }}-dependencies.txt
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux x86-64 (build + sign)
    if: >-
      github.repository == 'videoP/DinurdoJK' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    environment: release-signing
    outputs:
      public_key: ${{ vars.DINURDOJK_UPDATE_PUBLIC_KEY_HEX }}
    env:
      GH_TOKEN: ${{ github.token }}
      DINURDOJK_UPDATE_PUBLIC_KEY_HEX: ${{ vars.DINURDOJK_UPDATE_PUBLIC_KEY_HEX }}
      CARGO_INCREMENTAL: '0'
      AUDIONIMBUS_AUTO_INSTALL_PROGRESS: '0'
      # Literal $ORIGIN (no shell expansion here): libphonon.so ships in
      # DinurdoJK/dependencies beside the executable.
      RUSTFLAGS: '-C link-arg=-Wl,-rpath,$ORIGIN/DinurdoJK/dependencies'

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp version and check release eligibility
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stamp_ci_version.py
          tag="$(python3 scripts/make_signed_linux_release.py --print-tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [[ "${DINURDOJK_UPDATE_PUBLIC_KEY_HEX:-}" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'Missing release-signing Environment variable DINURDOJK_UPDATE_PUBLIC_KEY_HEX' >&2; exit 1; }
          if info="$(gh release view "$tag" --json targetCommitish,assets 2>/dev/null)"; then
            target="$(jq -r .targetCommitish <<<"$info")"
            [ "$target" = "$GITHUB_SHA" ] || { echo "Release $tag targets $target, not $GITHUB_SHA" >&2; exit 1; }
            if jq -e '.assets[] | select(.name == "release-manifest-linux-x86_64.sig")' <<<"$info" >/dev/null; then
              echo "$tag already has signed Linux assets; skipping compilation."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.release.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        if: steps.release.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libclang-dev \
            libasound2-dev libudev-dev libvulkan-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxi-dev libxrandr-dev curl
          clang_library="$(find /usr/lib/llvm-* -maxdepth 2 -name libclang.so -print -quit)"
          test -n "$clang_library"
          echo "LIBCLANG_PATH=$(dirname "$clang_library")" >> "$GITHUB_ENV"
          test "$(rustc -vV | sed -n 's/^host: //p')" = 'x86_64-unknown-linux-gnu'
          test "$(uname -m)" = 'x86_64'

      # Installed BEFORE the private key exists in any step's environment.
      - name: Install Ed25519 signer
        if: steps.release.outputs.build == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check 'cryptography>=44,<48'
          python3 -c 'from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey'

      - name: Cache Rust
        if: steps.release.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-unknown-linux-gnu

      - name: Restore private NWH source
        if: steps.release.outputs.build == 'true'
        shell: bash
        env:
          DINURDOJK_NWH_SOURCE_B64: ${{ secrets.DINURDOJK_NWH_SOURCE_B64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          source = os.environ.get('DINURDOJK_NWH_SOURCE_B64', '').strip()
          if not source:
              raise SystemExit('Missing release-signing Environment secret DINURDOJK_NWH_SOURCE_B64')
          path = Path('crates/jka-client/src/net/nwh_private.rs')
          if path.exists():
              raise SystemExit('Private NWH file unexpectedly exists')
          path.write_bytes(base64.b64decode(source, validate=True))
          PY

      - name: Compile Linux executable
        if: steps.release.outputs.build == 'true'
        run: cargo build --locked --release -p DinurdoJK

      # The packaged executable is DinurdoJK.x86_64: the DinurdoJK/ data folder
      # sits beside it, so a file named DinurdoJK cannot exist there.
      - name: Stage Steam Audio and verify Linux runtime linkage
        if: steps.release.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/DinurdoJK
          test -x "$binary"
          readelf -h "$binary" | grep -q 'Class:.*ELF64'
          readelf -h "$binary" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          readelf -d "$binary" | grep -Fq '$ORIGIN/DinurdoJK/dependencies'
          # Valve's library from this build's audionimbus OUT_DIR; never a system phonon.
          phonon="$(ls -t target/release/build/audionimbus-sys-*/out/lib/libphonon.so 2>/dev/null | head -n 1 || true)"
          test -n "$phonon" || { echo 'Steam Audio libphonon.so not found in the build output' >&2; exit 1; }
          readelf -h "$phonon" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          mkdir -p dist/linux-check/DinurdoJK/dependencies
          cp "$binary" dist/linux-check/DinurdoJK.x86_64
          cp "$phonon" dist/linux-check/DinurdoJK/dependencies/libphonon.so
          chmod 755 dist/linux-check/DinurdoJK.x86_64
          ldd dist/linux-check/DinurdoJK.x86_64 | tee dist/linux-dependencies.txt
          grep -F 'libphonon.so =>' dist/linux-dependencies.txt | grep -Fq 'linux-check/DinurdoJK/dependencies/libphonon.so'
          if grep -q 'not found' dist/linux-dependencies.txt; then
            echo 'Missing dynamic dependency in standalone Linux package' >&2
            exit 1
          fi
          echo "PHONON_PATH=$PWD/dist/linux-check/DinurdoJK/dependencies/libphonon.so" >> "$GITHUB_ENV"

      - name: Package and sign updater manifest
        if: steps.release.outputs.build == 'true'
        shell: bash
        env:
          # Private key is exposed to this one signing step only.
          DINURDOJK_UPDATE_PRIVATE_KEY_B64: ${{ secrets.DINURDOJK_UPDATE_PRIVATE_KEY_B64 }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "${DINURDOJK_UPDATE_PRIVATE_KEY_B64:-}" || {
            echo 'Missing release-signing Environment secret DINURDOJK_UPDATE_PRIVATE_KEY_B64' >&2
            exit 1
          }
          python3 scripts/make_signed_linux_release.py \
            --binary target/release/DinurdoJK \
            --phonon "$PHONON_PATH" \
            --assets assets/dinurdo-assets.pk4 \
            --license /usr/share/common-licenses/Apache-2.0 \
            --out dist/signed-linux --tag "$TAG"
          test "$(wc -c < dist/signed-linux/release-manifest-linux-x86_64.sig)" -eq 64

      - name: Upload signed Linux release files for common publisher
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-linux
          path: dist/signed-linux/*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Linux diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DinurdoJK-linux-diagnostics-${{ github.run_id }}
          path: dist/linux-dependencies.txt
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish available signed platforms
    needs: [windows, linux, macos]
    # Runs when any platform failed: it publishes whatever verified, signed
    # platform artifacts exist. Not gated by release-signing (no private key
    # here), so it never needs a second approval.
    if: >-
      !cancelled() && github.repository == 'videoP/DinurdoJK' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp the same version on publication checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stamp_ci_version.py
          python3 -m pip install --disable-pip-version-check 'cryptography>=44,<48'

      - name: Download successful platforms' signed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          merge-multiple: true
          path: dist/signed-platforms

      - name: Verify signatures and publish (draft first, never replacing complete platforms)
        shell: bash
        env:
          PUBLIC_KEY_HEX: ${{ needs.windows.outputs.public_key || needs.linux.outputs.public_key || needs.macos.outputs.public_key }}
        run: |
          set -euo pipefail
          tag="$(python3 scripts/make_signed_release.py --print-tag)"
          python3 scripts/publish_multiplatform_release.py \
            --tag "$tag" --commit "$GITHUB_SHA" \
            --input dist/signed-platforms \
            --shared-asset assets/dinurdo-assets.pk4 \
            --public-key-hex "$PUBLIC_KEY_HEX"
