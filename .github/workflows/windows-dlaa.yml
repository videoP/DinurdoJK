name: DinurdoJK Signed Windows Release (DLAA)

on:
  push:
    branches: [main]
  workflow_dispatch:

# A new Cargo version publishes once; subsequent same-version pushes are skipped.
concurrency:
  group: dinurdojk-signed-windows-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-release:
    if: github.repository == 'videoP/DinurdoJK' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 180
    environment: release-signing
    permissions:
      contents: write
    env:
      # The public key must be present at RUST COMPILATION time.
      DINURDOJK_UPDATE_PUBLIC_KEY_HEX: ${{ vars.DINURDOJK_UPDATE_PUBLIC_KEY_HEX }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate version, keys and release eligibility
        id: version
        shell: pwsh
        run: |
          if ($env:DINURDOJK_UPDATE_PUBLIC_KEY_HEX -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'Missing release-signing Environment variable DINURDOJK_UPDATE_PUBLIC_KEY_HEX.'
          }
          $tag = (& python scripts/make_signed_release.py --print-tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Invalid Cargo package version (expected vMAJOR.MINOR.PATCH).'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $json = gh release list --limit 100 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect GitHub Releases.' }
          $releases = @($json | ConvertFrom-Json)
          if (@($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            Write-Host "$tag already exists; skipping so signed release assets are never overwritten."
            'publish=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $version = [Version]::Parse($tag.Substring(1))
          foreach ($r in $releases) {
            if (-not $r.isDraft -and -not $r.isPrerelease -and $r.tagName -match '^v\d+\.\d+\.\d+$') {
              if ($version -le [Version]::Parse($r.tagName.Substring(1))) {
                throw "$tag is not newer than published release $($r.tagName). Bump crates/jka-client/Cargo.toml."
              }
            }
          }
          $existingTag = git ls-remote --tags --refs origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check tags.' }
          if ($existingTag) { throw "Tag $tag already exists without a Release; refusing to retag it." }
          'publish=true' >> $env:GITHUB_OUTPUT
          Write-Host "Building $tag from $env:GITHUB_SHA."

      # The full NWH module is deliberately absent from Git. Restore it only
      # for an approved release, before Cargo runs build.rs / rustc.
      - name: Restore local-only NWH source
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          DINURDOJK_NWH_SOURCE_B64: ${{ secrets.DINURDOJK_NWH_SOURCE_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DINURDOJK_NWH_SOURCE_B64)) {
            throw 'Missing release-signing Environment secret DINURDOJK_NWH_SOURCE_B64.'
          }
          $relativePath = 'crates/jka-client/src/net/nwh_private.rs'
          if (Test-Path -LiteralPath $relativePath) {
            throw 'Private NWH source unexpectedly exists in repository checkout.'
          }
          $fileBytes = [Convert]::FromBase64String($env:DINURDOJK_NWH_SOURCE_B64.Trim())
          if ($fileBytes.Length -eq 0) { throw 'Empty private NWH source.' }
          New-Item -ItemType Directory -Force (Split-Path $relativePath -Parent) | Out-Null
          $absolutePath = Join-Path (Get-Location).Path $relativePath
          [System.IO.File]::WriteAllBytes($absolutePath, $fileBytes)
          # No source content or key material is printed to Actions logs.
          Write-Host 'Restored private NWH module for release compilation.'

      - name: Install Rust
        if: steps.version.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust compilation
        if: steps.version.outputs.publish == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install Vulkan SDK
        if: steps.version.outputs.publish == 'true'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Check Vulkan SDK
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) {
            throw 'VULKAN_SDK not configured by SDK installer.'
          }

      - name: Ensure libclang
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            choco install llvm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed.' }
          }
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) { throw 'libclang.dll missing.' }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV

      - name: Fetch NVIDIA DLSS SDK v310.9.1
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'NVIDIA-DLSS-310.9.1'
          git clone --depth 1 --branch v310.9.1 https://github.com/NVIDIA/DLSS.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'DLSS SDK download failed.' }
          Push-Location $sdk
          try {
            git lfs pull
            if ($LASTEXITCODE -ne 0) { throw 'DLSS SDK LFS download failed.' }
          } finally { Pop-Location }
          $dll = Join-Path $sdk 'lib\Windows_x86_64\rel\nvngx_dlss.dll'
          if (-not (Test-Path $dll) -or (Get-Item $dll).Length -lt 1000000) {
            throw 'nvngx_dlss.dll missing or appears to be an LFS pointer.'
          }
          $stream = [System.IO.File]::OpenRead($dll)
          try { $mz = ($stream.ReadByte() -eq 77 -and $stream.ReadByte() -eq 90) }
          finally { $stream.Dispose() }
          if (-not $mz) { throw 'DLSS DLL is not a Windows PE file.' }
          if (-not (Test-Path (Join-Path $sdk 'LICENSE.txt'))) { throw 'NVIDIA SDK license missing.' }
          "DLSS_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Prepare required build helpers and license
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          foreach ($helper in @('scripts/build-cache-report.ps1', 'scripts/ensure-smaa-vendor.ps1', 'scripts/ensure-openal-runtime.ps1')) {
            if (-not (Test-Path $helper)) { throw "Missing $helper. Commit your local build helpers first." }
          }
          if (-not (Test-Path 'assets/dinurdo-assets.pk4')) {
            throw 'Missing committed assets/dinurdo-assets.pk4 for the signed ZIP.'
          }
          # Current build.ps1 expects a target/fast license even in Release mode.
          $license = 'target/fast/licenses/OpenAL-Soft-LGPL-2.0.txt'
          New-Item -ItemType Directory -Force (Split-Path $license) | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/kcat/openal-soft/master/COPYING' -OutFile $license
          if (-not (Test-Path $license) -or (Get-Item $license).Length -eq 0) {
            throw 'OpenAL-Soft license download failed.'
          }
          # Stage OpenAL from the same pinned/runtime helper used by build.ps1.
          # Do this BEFORE the expensive Rust build so missing DLLs fail early.
          $workspace = (Get-Location).Path
          . (Join-Path $workspace 'scripts/ensure-openal-runtime.ps1')
          $openal = Ensure-OpenALRuntime -WorkspaceRoot $workspace
          if (-not $openal -or -not (Test-Path -LiteralPath $openal -PathType Leaf)) {
            throw 'Ensure-OpenALRuntime did not return an existing OpenAL DLL.'
          }
          $openal = (Resolve-Path -LiteralPath $openal).Path
          $dllStream = [IO.File]::OpenRead($openal)
          try { $isPE = ($dllStream.ReadByte() -eq 0x4d -and $dllStream.ReadByte() -eq 0x5a) }
          finally { $dllStream.Dispose() }
          if (-not $isPE -or (Get-Item -LiteralPath $openal).Length -lt 32768) {
            throw "OpenAL runtime is not a valid-looking Windows DLL: $openal"
          }
          $dependencyDir = 'target/release/DinurdoJK/dependencies'
          New-Item -ItemType Directory -Force $dependencyDir | Out-Null
          $openalStaged = Join-Path $dependencyDir 'OpenALSoft.x86_64.dll'
          if ([IO.Path]::GetFullPath($openal) -ine [IO.Path]::GetFullPath($openalStaged)) {
            Copy-Item -LiteralPath $openal -Destination $openalStaged -Force -ErrorAction Stop
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $openal).Hash -ne
              (Get-FileHash -Algorithm SHA256 -LiteralPath $openalStaged).Hash) {
            throw 'Staged OpenAL DLL hash differs from helper output.'
          }
          Write-Host "Pre-staged OpenALSoft.x86_64.dll in $dependencyDir"

      - name: Build optimized Release with DLAA
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          .\build.ps1 -Fetch -Dlss
          if ($LASTEXITCODE -ne 0) { throw 'DinurdoJK Release build failed.' }
          if (-not (Test-Path 'target/release/DinurdoJK.exe' -PathType Leaf)) {
            throw 'Missing release executable.'
          }
          # The packager understands either staging layout, but always publishes
          # the updated DinurdoJK/dependencies layout in its signed manifest.
          foreach ($dll in @('nvngx_dlss.dll', 'OpenALSoft.x86_64.dll')) {
            if (-not (Test-Path "target/release/DinurdoJK/dependencies/$dll" -PathType Leaf) -and
                -not (Test-Path "target/release/$dll" -PathType Leaf)) {
              throw "Missing required runtime $dll (checked dependencies and legacy staging)."
            }
          }

      # Pin the exact official Microsoft Windows DXC archive and verify its
      # SHA-256 before any binaries are included in an authenticated release.
      # Source: microsoft/DirectXShaderCompiler v1.9.2609 (2026-09-29).
      - name: Stage pinned Microsoft DXC x64 runtime
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = 'v1.9.2609'
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$version/dxc_2026_09_29.zip"
          $expectedSha256 = 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1'
          $archive = Join-Path $env:RUNNER_TEMP 'dxc_2026_09_29.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'dxc_2026_09_29'
          Invoke-WebRequest -Uri $url -OutFile $archive -ErrorAction Stop
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -cne $expectedSha256) {
            throw "Microsoft DXC download checksum mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          foreach ($name in @('dxcompiler.dll', 'dxil.dll')) {
            $source = Join-Path $unpacked "bin/x64/$name"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or
                (Get-Item -LiteralPath $source).Length -lt 100000) {
              throw "Pinned DXC archive is missing x64 $name"
            }
            $stream = [IO.File]::OpenRead($source)
            try { $isPe = ($stream.ReadByte() -eq 0x4d -and $stream.ReadByte() -eq 0x5a) }
            finally { $stream.Dispose() }
            if (-not $isPe) { throw "Not a Windows PE file: $name" }
            $deps = 'target/release/DinurdoJK/dependencies'
            New-Item -ItemType Directory -Force $deps | Out-Null
            Copy-Item -LiteralPath $source -Destination (Join-Path $deps $name) -Force
          }
          # Ship Microsoft's license and third-party notices alongside the
          # signed DLLs. Like all other update assets these are hash-verified.
          $licenses = 'target/release/licenses'
          New-Item -ItemType Directory -Force $licenses | Out-Null
          foreach ($item in @(
              @{ source = 'LICENSE.TXT'; destination = 'DXC-LICENSE.txt' },
              @{ source = 'ThirdPartyNotices.txt'; destination = 'DXC-ThirdPartyNotices.txt' }
          )) {
            $noticeUrl = "https://raw.githubusercontent.com/microsoft/DirectXShaderCompiler/$version/$($item.source)"
            $destination = Join-Path $licenses $item.destination
            Invoke-WebRequest -Uri $noticeUrl -OutFile $destination -ErrorAction Stop
            if ((Get-Item -LiteralPath $destination).Length -lt 1000) {
              throw "Missing or truncated Microsoft DXC notice: $($item.destination)"
            }
          }
          Write-Host 'Staged checksum-verified Microsoft DXC x64 DLLs and notices.'

      - name: Install Ed25519 signer
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: python -m pip install --disable-pip-version-check 'cryptography>=43,<48'

      - name: Package and sign updater release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          # Private key is exposed to this one signing step, NEVER to the build.
          DINURDOJK_UPDATE_PRIVATE_KEY_B64: ${{ secrets.DINURDOJK_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          $licenseDir = 'target/release/licenses'
          New-Item -ItemType Directory -Force $licenseDir | Out-Null
          Copy-Item (Join-Path $env:DLSS_SDK 'LICENSE.txt') (Join-Path $licenseDir 'NVIDIA-DLSS-SDK-LICENSE.txt') -ErrorAction Stop
          foreach ($name in @('dxcompiler.dll', 'dxil.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'target/release/DinurdoJK/dependencies' $name) -PathType Leaf)) {
              throw "Missing Microsoft DXC runtime before signing: $name"
            }
          }
          python scripts/make_signed_release.py --runtime target/release --out dist/release --tag '${{ steps.version.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { throw 'Release signing failed.' }
          if ((Get-Item 'dist/release/release-manifest.sig').Length -ne 64) {
            throw 'Signature must be 64 raw Ed25519 bytes.'
          }
          # The full ZIP is for new/manual installations. Individual assets
          # are for the updater; the signed manifest binds their exact hashes.
          $archive = "dist/release/DinurdoJK-${{ steps.version.outputs.tag }}-full.zip"
          python -c 'import sys, json, zipfile, pathlib, hashlib; p=pathlib.Path(sys.argv[1]); d=p.parent; z=zipfile.ZipFile(p); m=json.loads((d/"release-manifest.json").read_bytes()); assert m["format"]==2; assert set(z.namelist())==set(m["files"]); assert "DinurdoJK/shared/dinurdo-assets.pk4" in z.namelist(); assert "DinurdoJK.exe" in z.namelist(); assert "DinurdoJK/dependencies/dxcompiler.dll" in z.namelist() and "DinurdoJK/dependencies/dxil.dll" in z.namelist(); assert all(hashlib.sha256(z.read(n)).hexdigest()==f["sha256"] for n,f in m["files"].items()); print("Verified full ZIP and signed per-file hashes")' $archive
          if ($LASTEXITCODE -ne 0) { throw 'Release layout and hashes failed verification.' }

      - name: Upload signed updater artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DinurdoJK-${{ steps.version.outputs.tag }}-signed-update
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Create official GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $assets = @(Get-ChildItem 'dist/release' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $manifest = Get-Content 'dist/release/release-manifest.json' -Raw | ConvertFrom-Json
          $expectedCount = @($manifest.files.PSObject.Properties).Count + 3
          if ($assets.Count -ne $expectedCount) {
            throw "Expected $expectedCount assets (individual files + full ZIP + manifest + signature); found $($assets.Count)"
          }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "DinurdoJK $tag" --latest --notes "Windows x64 with Vulkan DLAA. Download the full ZIP for a new install. Existing DinurdoJK clients with signed per-file update support download only changed files. Retail Jedi Academy assets are NOT included."
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create official GitHub Release.' }
          $release = gh release view $tag --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease) {
            throw 'GitHub Release verification failed.'
          }
          foreach ($asset in $assets) {
            $name = Split-Path -Leaf $asset
            if (@($release.assets | Where-Object { $_.name -eq $name }).Count -ne 1) {
              throw "Missing GitHub Release asset $name"
            }
          }
          Write-Host "Published $tag and verified all $expectedCount release assets."
