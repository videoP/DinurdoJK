name: DinurdoJK Linux (Build and Signed Release)

# One Linux compilation per run. Every run uploads a build artifact; following
# successful Windows publication it also packages/signs and attaches Linux
# assets to that same release. No Windows/macOS job depends on Linux success.
on:
  workflow_run:
    workflows: ["DinurdoJK Signed Windows Release (DLAA)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release:
    if: >-
      github.repository == 'videoP/DinurdoJK' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'videoP/DinurdoJK' &&
      github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    environment: release-signing
    env:
      GH_TOKEN: ${{ github.token }}
      DINURDOJK_UPDATE_PUBLIC_KEY_HEX: ${{ vars.DINURDOJK_UPDATE_PUBLIC_KEY_HEX }}
      DINURDOJK_NWH_SOURCE_B64: ${{ secrets.DINURDOJK_NWH_SOURCE_B64 }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      AUDIONIMBUS_AUTO_INSTALL_PROGRESS: '0'
      RUSTFLAGS: '-C link-arg=-Wl,-rpath,$ORIGIN/DinurdoJK/dependencies'

    steps:
      - name: Checkout exact Windows release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python for signing tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find version-matched published Windows release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stamp_ci_version.py
          tag="$(python3 scripts/make_signed_linux_release.py --print-tag)"
          commit="$(git rev-parse HEAD)"
          if ! target="$(gh release view "$tag" --json targetCommitish -q .targetCommitish 2>/dev/null)"; then
            echo "::notice::No Windows release matching $tag; Linux publication skipped."
            echo 'matching=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$target" != "$commit" ]]; then
            echo "::notice::Windows release $tag points to $target, not $commit; Linux publication skipped."
            echo 'matching=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'matching=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libclang-dev \
            libasound2-dev libudev-dev libvulkan-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxi-dev libxrandr-dev curl
          clang_library="$(find /usr/lib/llvm-* -maxdepth 2 -name libclang.so -print -quit)"
          test -n "$clang_library"
          echo "LIBCLANG_PATH=$(dirname "$clang_library")" >> "$GITHUB_ENV"
          test "$(rustc -vV | sed -n 's/^host: //p')" = 'x86_64-unknown-linux-gnu'
          test "$(uname -m)" = 'x86_64'

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-unknown-linux-gnu

      - name: Restore private NWH source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          source = os.environ.get('DINURDOJK_NWH_SOURCE_B64', '').strip()
          if not source:
              raise SystemExit('Missing DINURDOJK_NWH_SOURCE_B64')
          path = Path('crates/jka-client/src/net/nwh_private.rs')
          if path.exists():
              raise SystemExit('Private NWH file unexpectedly exists')
          path.write_bytes(base64.b64decode(source, validate=True))
          PY

      - name: Compile Linux executable
        run: cargo build --locked --release -p DinurdoJK

      - name: Verify and archive native Linux build
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/DinurdoJK
          test -x "$binary"
          file "$binary"
          readelf -h "$binary" | grep -q 'Class:.*ELF64'
          readelf -h "$binary" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          mkdir -p dist/compile
          cp "$binary" dist/compile/DinurdoJK
          chmod 755 dist/compile/DinurdoJK
          ldd "$binary" | tee dist/linux-compile-dependencies.txt || true
          tar -C dist/compile -czf dist/DinurdoJK-linux-x86_64.tar.gz DinurdoJK
          sha256sum dist/DinurdoJK-linux-x86_64.tar.gz

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinurdoJK-linux-x86_64-${{ github.run_id }}
          path: |
            dist/DinurdoJK-linux-x86_64.tar.gz
            dist/linux-compile-dependencies.txt
          if-no-files-found: error
          retention-days: 14

      - name: Locate bundled Steam Audio and verify Linux runtime
        if: steps.release.outputs.matching == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/DinurdoJK
          readelf -h target/release/DinurdoJK | grep -q 'Class:.*ELF64'
          readelf -h target/release/DinurdoJK | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          readelf -d target/release/DinurdoJK | grep -Fq '$ORIGIN/DinurdoJK/dependencies'
          # audionimbus auto-install downloads Valve's native shared library.
          # It can be in a Cargo build OUT_DIR or the user's cache. Never take
          # an arbitrary system phonon. Fail closed if the matching SDK is absent.
          phonon="$(find target "$HOME" -type f -name 'libphonon.so' -print -quit 2>/dev/null)"
          test -n "$phonon" || { echo 'Steam Audio libphonon.so not found in build/cache' >&2; exit 1; }
          readelf -h "$phonon" | grep -q 'Class:.*ELF64'
          readelf -h "$phonon" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          mkdir -p dist/linux-check/DinurdoJK/dependencies
          cp target/release/DinurdoJK dist/linux-check/DinurdoJK
          cp "$phonon" dist/linux-check/DinurdoJK/dependencies/libphonon.so
          chmod 755 dist/linux-check/DinurdoJK
          ldd dist/linux-check/DinurdoJK | tee dist/linux-dependencies.txt
          if grep -q 'not found' dist/linux-dependencies.txt; then
            echo 'Missing dynamic dependency in standalone Linux package' >&2
            exit 1
          fi
          echo "PHONON_PATH=$phonon" >> "$GITHUB_ENV"

      - name: Download Windows release's shared assets
        if: steps.release.outputs.matching == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-asset"
          gh release download "$TAG" --pattern dinurdo-assets.pk4 --dir "$RUNNER_TEMP/windows-asset"
          test -s "$RUNNER_TEMP/windows-asset/dinurdo-assets.pk4"

      - name: Sign and package Linux release
        if: steps.release.outputs.matching == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          DINURDOJK_UPDATE_PRIVATE_KEY_B64: ${{ secrets.DINURDOJK_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "${DINURDOJK_UPDATE_PUBLIC_KEY_HEX:-}" || { echo 'Public update key missing' >&2; exit 1; }
          test -n "${DINURDOJK_UPDATE_PRIVATE_KEY_B64:-}" || { echo 'Private update key missing' >&2; exit 1; }
          python3 -m pip install 'cryptography>=44,<48'
          python3 scripts/make_signed_linux_release.py \
            --binary target/release/DinurdoJK \
            --phonon "$PHONON_PATH" \
            --assets "$RUNNER_TEMP/windows-asset/dinurdo-assets.pk4" \
            --license /usr/share/common-licenses/Apache-2.0 \
            --out dist/signed-linux --tag "$TAG"

      - name: Publish only Linux assets to existing release
        if: steps.release.outputs.matching == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "dist/signed-linux/DinurdoJK-${TAG}-linux-x86_64-standalone.tar.gz" \
            dist/signed-linux/DinurdoJK-linux-x86_64 \
            dist/signed-linux/libphonon-linux-x86_64.so \
            dist/signed-linux/release-manifest-linux-x86_64.json \
            dist/signed-linux/release-manifest-linux-x86_64.sig
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fx release-manifest-linux-x86_64.sig

      - name: Preserve debug artifacts if Linux release fails
        if: failure() && steps.release.outputs.matching == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DinurdoJK-linux-release-diagnostics-${{ github.run_id }}
          path: |
            dist/linux-dependencies.txt
          if-no-files-found: ignore
          retention-days: 7
